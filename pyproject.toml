[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ehrm"
version = "0.1.0"
description = "E-HRM browser automation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "defusedxml==0.7.1",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "opencv-python-headless==4.12.0.88",
  "playwright==1.61.0",
]

[project.optional-dependencies]
gui = ["PySide6==6.10.1"]
build = ["PyInstaller==6.21.0"]
dev = ["pytest==9.1.1"]

[project.scripts]
ehrm = "ehrm.entrypoints.cli:main"
ehrm-gui = "ehrm.gui.app:main"
ehrm-erp = "ehrm.entrypoints.erp_cli:main"
ehrm-erp-extract = "ehrm.entrypoints.erp_task_extraction_cli:main"
ehrm-login-e2e = "ehrm.entrypoints.login_e2e_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ehrm.gui" = ["qml/*.qml", "assets/*.svg"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
