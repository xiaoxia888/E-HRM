# E-HRM 运行与业务配置
#
# 本文件由部署/运维人员维护，只保存运行参数、站点与接口地址、业务规则、
# 超时和重试策略。页面 CSS、文本按钮、iframe 等定位契约统一维护在同目录的
# page_selectors.toml 中，修改网页定位时不要改动本文件。
#
# 应限制本文件的读取权限，后续可再迁移为环境变量。
# 时间字段以 _ms 结尾时单位为毫秒，以 _seconds 结尾时单位为秒。

[common]
# 智慧人社和 ERP 共用的 Playwright 单次操作超时。
action_timeout_ms = 30000

# -----------------------------------------------------------------------------
# 智慧人社 / 单位权益单模块
# -----------------------------------------------------------------------------

[rights_statement.execution]
# 权益单打印后端：
#   "api"     = 通过业务接口查询人员、获取流水号并生成 PDF（推荐）。
#   "browser" = 保留原来的纯浏览器页面操作流程。
backend = "api"

[rights_statement.browser]
# Playwright 浏览器内核：chromium、firefox 或 webkit。
# Chrome 和 Edge 都属于 Chromium 内核，因此使用它们时 engine 仍填写 chromium。
engine = "chromium"

# Chromium 发行通道：
#   ""       = Playwright 自带 Chromium
#   "chrome" = 本机安装的 Google Chrome Stable
#   "msedge" = 本机安装的 Microsoft Edge Stable
# firefox/webkit 不支持 channel，使用它们时必须填写空字符串。
channel = ""

# true 隐藏浏览器窗口，false 显示浏览器窗口；两种模式的浏览器进程都会在工作台内常驻。
# browser 后端需要人工观察或接管登录时，应设置为 false。
headless = false
silent_session_check = false
# 正式运行保持 0；仅在人工调试、观察每一步操作时临时调大。
slow_mo_ms = 0
navigation_timeout_ms = 60000
manual_login_timeout_seconds = 300

# 相对于程序的 runtime 目录解析；源码和安装环境使用相同目录结构。
user_data_dir = "data/browser-profile"
storage_state_path = "data/session-state.json"

[rights_statement.browser.pacing]
# 智慧人社页面的 DOM 交互节奏。仅作用于点击、填写、选择等浏览器动作；
# 页面状态轮询和 HTTP API 请求不会使用这里的等待时间。
enabled = true
min_delay_ms = 1000
max_delay_ms = 2000

[rights_statement.site]
login_url = "https://rs.jshrss.jiangsu.gov.cn/web/login"
page_url = "https://rs.jshrss.jiangsu.gov.cn/web/center/unit/rightsBill"
# 单位账号密码登录接口。这里只配置路径，主机和端口始终取 login_url。
unit_password_login_path = "/zuul/api/auth/unit/unitPasswordLogin"

[rights_statement.government_login]
# 第二种登录方式：江苏政务服务平台法人账号登录。登录成功后进入同一智慧人社业务站点。
# 程序必须先访问智慧人社登录页，从“单位登录”区域点击“江苏政务服务网”。
# 此地址只用于校验自然跳转的域名和路径，程序不会直接访问；动态查询参数不写入配置。
landing_url = "https://www.jszwfw.gov.cn/jsjis/front/login.do"
login_api_path = "/jsjis/front/coruser/docoruserlogin.do"
# 仅用于校验政务平台自然重定向的最终落点，程序不会主动导航到此地址。
target_url = "https://rs.jshrss.jiangsu.gov.cn/web/unitcenter/unitmain"
max_attempts = 3
response_timeout_ms = 30000

[rights_statement.api]
# 智慧人社业务接口只配置路径，主机和端口始终取 login_url。
# 根据身份证或姓名查询人员，并返回打印所需的 bac001。
query_common_path = "/api/ggfw-business-center/insurance/queryCommon"
# 每次打印前领取服务端生成的 businessNo。
acquire_business_no_path = "/api/ggfw-affair-base-center/affair/case/right/bill"
# 使用 businessNo、险种、期间和 bac001 列表生成 Base64 PDF。
load_unit_rights_bill_path = "/api/ggfw-business-center/insurance/loadUnitRightsBill"
# 人员查询接口默认每页数量。
page_size = 100
# 单次业务 API 请求超时，单位毫秒；正常接口应快速返回，此值仅作为异常保护上限。
request_timeout_ms = 30000

[rights_statement.operations.rights_bill]
# 以下参数只控制浏览器版单位权益单页面的等待与确认节奏；API 版权益单使用
# rights_statement.api.request_timeout_ms。全部以毫秒为单位。

# 点击查询后，等待人员表格、无结果提示或业务错误出现的最长时间。
query_result_timeout_ms = 45000
# 人员在候选区与已选区之间移动后，等待目标列表更新的最长时间。
transfer_result_timeout_ms = 10000
# 点击预览后，等待权益单预览弹窗和可下载内容就绪的最长时间。
preview_ready_timeout_ms = 30000
# 无结果确认、预览下载等待和下载超时由“系统设置 → 执行设置”统一管理。

[rights_statement.employment_termination]
# 退工停保业务从智慧人社大厅首页进入；这里只配置路径，主机继承 login_url。
home_path = "/index/"
# 执行前必须校验为南京地区，不能依赖模糊的页面文字判断。
city_code = "320100"
city_name = "南京"
# 人员查询响应必须同时匹配此路径和当前身份证请求，不再兜底匹配其他接口。
person_query_path = "/api/ehrss-si-enterprise-app/api/simis/persons/employees"
# 显式启用提交后观察的接口；仅监听浏览器真实请求，不直接重放接口。
# submitSave 空响应可正常；dimissionApply 以布尔 ok 判断；complete 按办件关联校验。
submit_save_path = "/api/ehrss-si-enterprise-app/api/changeAndLookController/submitSave"
submit_apply_path = "/api/ehrss-si-enterprise-app/api/applys/employee/dimissionApply"
submit_complete_path = "/api/ggfw-affair-base-center/affair/case/commbusiness/complete"
# 人员查询/提交接口响应和页面遮罩的异常保护上限；提交复用同一响应等待配置。
response_timeout_ms = 15000
loading_timeout_ms = 30000

[rights_statement.captcha]
# true：必须自动完成验证码；任何识别、限流或配置错误都会立即结束登录，
#       不会进入人工验证等待，适用于隐藏浏览器。
# false：不执行自动识别，提交登录后等待用户在可见浏览器中人工验证。
# 仅在白名单主机上启用自动验证。这里只填写主机/IP，不填写端口；
# 因此 127.0.0.1:6066 和 127.0.0.1:8000 都匹配 127.0.0.1。
enabled = true
# 仅当智慧人社登录入口命中 allowed_hosts 时，才对该测试 BrowserContext 启用官方 stealth 注入。
stealth_enabled = true
allowed_hosts = [
  "127.0.0.1",
  "localhost",
  "rs.jshrss.jiangsu.gov.cn",
  "turing.captcha.qcloud.com",
  # 网易易盾拼图图片 CDN 和校验接口；只允许已知域名，不能使用泛域名。
  "necaptcha.nosdn.127.net",
  "c.dun.163.com"
]
# 原有图形点击验证码的校验路径；易盾滑块固定监听其 /api/v3/check 响应。
verify_path = "/cap_union_new_verify"
max_attempts = 3
# 仅用于原有图形点击验证码：每个识别点在网页 CSS 像素范围内随机偏移，
# 实际偏移仍限制在匹配框内部。滑块使用图片宽度和元素位置换算拖动距离。
click_offset_max_px = 3
# 是否保存验证码识别诊断图片；正常运行建议关闭。
diagnostic_images_enabled = false
# 开启后按运行批次保存目标图、背景图和标注最终点击顺序的结果图。
# 相对于程序的 runtime 目录解析，源码和安装环境使用相同目录结构。
diagnostic_output_dir = "diagnostics/captcha"
frame_timeout_ms = 10000
verify_timeout_ms = 15000

# -----------------------------------------------------------------------------
# NocoBase 权益单申请模块
# -----------------------------------------------------------------------------

[nocobase.site]
# NocoBase 服务地址集中配置，业务代码和测试中不写死主机、端口。
base_url = "http://cloud.njncc.com:443"
# 仅供旧认证模块兼容；当前页面、查询服务和测试入口使用 API 密钥，不调用此路径。
sign_in_path = "/api/auth:signIn"
# 权益申请分页查询资源路径；主机和端口统一继承 base_url。
rights_application_list_path = "/api/NCC_HumProblem:list"
# 权益申请详情查询资源路径；具体记录编号由程序作为 filterByTk 参数传入。
rights_application_detail_path = "/api/NCC_HumProblem:get"
# 分页列表默认每页数量。
default_page_size = 20
request_timeout_ms = 15000

[nocobase.sync]
# 同步仅搬运 ERP 原始申请，不调用模型，不写人员、附件或人工办理字段。
application_create_path = "/api/NCC_HumProblem:create"
application_update_path = "/api/NCC_HumProblem:update"
# 发起人按 users.nickname 精确匹配；查不到或重名时留空。
users_list_path = "/api/users:list"
# 以下是首次初始化的默认值；在“定时任务”页面保存后，以数据库中的设置为准。
# 默认关闭，配置好 ERP 账号、NocoBase API 密钥和写入权限后手动开启。
enabled = false
# 五段 Unix cron：分 时 日 月 星期，时区 Asia/Shanghai；0/7 表示周日。
# 默认每小时整点；例如每天 08:00 为 "0 8 * * *"。
# 仅决定触发时间，不决定回查范围。手动执行不改变下一次计划时间。
cron = "0 * * * *"
# 按 ERP 申请日期回查的自然日数，包含今天；2 表示今天和昨天。
# 不代表按更新时间查询，较早申请的修改需手动指定日期范围回查。
lookback_days = 2

