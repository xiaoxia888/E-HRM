# E-HRM 唯一系统配置
#
# 只维护系统级规则，不保存账号密码、下载目录等个人数据。
# 时间字段以 _ms 结尾时单位为毫秒，以 _seconds 结尾时单位为秒。

[common]
# 智慧人社和 ERP 共用的 Playwright 单次操作超时。
action_timeout_ms = 30000

# -----------------------------------------------------------------------------
# 智慧人社 / 单位权益单模块
# -----------------------------------------------------------------------------

[rights_statement.execution]
# 权益单打印后端：
#   "api"     = 通过业务接口查询人员、获取流水号并生成 PDF（推荐）。
#   "browser" = 保留原来的纯浏览器页面操作流程。
backend = "api"

[rights_statement.browser]
# Playwright 浏览器内核：chromium、firefox 或 webkit。
# Chrome 和 Edge 都属于 Chromium 内核，因此使用它们时 engine 仍填写 chromium。
engine = "chromium"

# Chromium 发行通道：
#   ""       = Playwright 自带 Chromium
#   "chrome" = 本机安装的 Google Chrome Stable
#   "msedge" = 本机安装的 Microsoft Edge Stable
# firefox/webkit 不支持 channel，使用它们时必须填写空字符串。
channel = ""

# true 隐藏浏览器窗口，false 显示浏览器窗口；两种模式的浏览器进程都会在工作台内常驻。
# browser 后端需要人工观察或接管登录时，应设置为 false。
headless = true
silent_session_check = false
slow_mo_ms = 100
navigation_timeout_ms = 60000
manual_login_timeout_seconds = 300

# 相对于程序的 runtime 目录解析；源码和安装环境使用相同目录结构。
user_data_dir = "data/browser-profile"
storage_state_path = "data/session-state.json"

[rights_statement.site]
login_url = "https://rs.jshrss.jiangsu.gov.cn/web/login"
page_url = "https://rs.jshrss.jiangsu.gov.cn/web/center/unit/rightsBill"
# 单位账号密码登录接口。这里只配置路径，主机和端口始终取 login_url。
unit_password_login_path = "/zuul/api/auth/unit/unitPasswordLogin"

[rights_statement.api]
# 智慧人社业务接口只配置路径，主机和端口始终取 login_url。
# 根据身份证或姓名查询人员，并返回打印所需的 bac001。
query_common_path = "/api/ggfw-business-center/insurance/queryCommon"
# 每次打印前领取服务端生成的 businessNo。
acquire_business_no_path = "/api/ggfw-affair-base-center/affair/case/right/bill"
# 使用 businessNo、险种、期间和 bac001 列表生成 Base64 PDF。
load_unit_rights_bill_path = "/api/ggfw-business-center/insurance/loadUnitRightsBill"
# 人员查询接口默认每页数量。
page_size = 100
# 单次业务 API 请求超时，单位毫秒；正常接口应快速返回，此值仅作为异常保护上限。
request_timeout_ms = 30000

[rights_statement.credentials]
# 这里只保存环境变量名称，不保存真实账号密码。
credit_code_env = "EHRM_RIGHTS_CREDIT_CODE"
mobile_env = "EHRM_RIGHTS_MOBILE"
password_env = "EHRM_RIGHTS_PASSWORD"

[rights_statement.captcha]
# true：必须自动完成验证码；任何识别、限流或配置错误都会立即结束登录，
#       不会进入人工验证等待，适用于隐藏浏览器。
# false：不执行自动识别，提交登录后等待用户在可见浏览器中人工验证。
# 仅在白名单主机上启用自动验证。这里只填写主机/IP，不填写端口；
# 因此 127.0.0.1:6066 和 127.0.0.1:8000 都匹配 127.0.0.1。
enabled = true
# 仅当 login_url 命中 allowed_hosts 时，才对该测试 BrowserContext 启用官方 stealth 注入。
stealth_enabled = true
allowed_hosts = [
  "127.0.0.1",
  "localhost",
  "rs.jshrss.jiangsu.gov.cn",
  "turing.captcha.qcloud.com"
]
verify_path = "/cap_union_new_verify"
max_attempts = 3
click_delay_min_ms = 1000
click_delay_max_ms = 2000
# 每个识别点在网页 CSS 像素范围内随机偏移；实际偏移仍限制在匹配框内部。
click_offset_max_px = 3
# 是否保存验证码识别诊断图片；正常运行建议关闭。
diagnostic_images_enabled = false
# 开启后按运行批次保存目标图、背景图和标注最终点击顺序的结果图。
# 相对于程序的 runtime 目录解析，源码和安装环境使用相同目录结构。
diagnostic_output_dir = "diagnostics/captcha"
frame_timeout_ms = 10000
verify_timeout_ms = 15000
# 验证码识别等待时间
image_change_timeout_ms = 10000

[rights_statement.selectors.login]
# 以下定位器来自 Playwright 对登录页的实际录制结果：
# “单位登录”只有一个匹配项；单位登录区域的“账号密码”是页面中的第二个同名项。
unit_login_tab = 'text="单位登录"'
account_password_tab = 'text="账号密码" >> nth=1'
# 输入框定位器同样来自 Playwright 录制结果。
# 图形安全验证仍由用户手动完成。
credit_code = 'role=textbox[name="统一社会信用代码/单位编号/机构编号"]'
mobile = 'role=textbox[name="证件号码/移动电话"]'
password = 'role=textbox[name="请输入密码"]'
submit = 'role=button[name="登录"]'
authenticated_marker = "text=省本级"

[rights_statement.selectors.navigation]
province_entry = "text=省本级"
city_entry = "text=南京"
page_menu = "text=单位权益单"

[rights_statement.selectors.page]
start_month = 'role=textbox[name="选择年月"] >> nth=0'
end_month = 'role=textbox[name="选择年月"] >> nth=1'
insurance_type = "role=combobox"
insurance_option_template = 'role=option[name="{value}"]'
social_security_number = "role=textbox >> nth=4"
employee_name = "role=textbox >> nth=5"
query_button = 'role=button[name="查 询"]'
results_ready = "role=row"
no_results = "text=暂无数据"
loading_indicator = ".ant-spin-spinning:visible"

# 权益单业务阶段超时和动作缓冲。
query_result_timeout_ms = 45000
no_result_confirm_ms = 10000
transfer_result_timeout_ms = 10000
step_delay_ms = 1000
preview_ready_timeout_ms = 30000
preview_download_delay_ms = 1500
download_timeout_ms = 20000

# 官网页面结构定位器，仅由开发人员维护。
calendar_popup = ".ant-calendar:visible"
candidate_table = ""
selected_table = "div:nth-child(3) > .ant-table-wrapper"
transfer_left = ".arrowLeft"
transfer_back = ".arrowRight"
generate_button = 'role=button[name="预览权益单"]'
download_ready = "text=缴费月数"
download_button = 'role=button[name="图标: download 下载"]'
preview_dialog = ".ant-modal:visible"
close_preview = 'role=button[name="Close"]'

# -----------------------------------------------------------------------------
# NocoBase 权益单申请模块
# -----------------------------------------------------------------------------

[nocobase.site]
# NocoBase 服务地址集中配置，业务代码和测试中不写死主机、端口。
base_url = "http://211.138.201.5:443"
sign_in_path = "/api/auth:signIn"
# 权益申请分页查询资源路径；主机和端口统一继承 base_url。
rights_application_list_path = "/api/NCC_HumProblem:list"
# 权益申请详情查询资源路径；具体记录编号由程序作为 filterByTk 参数传入。
rights_application_detail_path = "/api/NCC_HumProblem:get"
# 分页列表默认每页数量。
default_page_size = 20
request_timeout_ms = 15000

[nocobase.credentials]
# 这里只配置环境变量名称，不在配置文件中保存真实账号密码。
account_env = "EHRM_NOCOBASE_ACCOUNT"
password_env = "EHRM_NOCOBASE_PASSWORD"

# -----------------------------------------------------------------------------
# ERP 附件模块
# -----------------------------------------------------------------------------

[erp.browser]
# ERP 无验证码，默认无界面静默执行。
headless = true
user_data_dir = "data/erp-browser-profile"
login_timeout_ms = 60000
request_timeout_ms = 60000

[erp.site]
base_url = "https://erp.njncc.com"
login_url = "https://erp.njncc.com/"
application_url = "https://erp.njncc.com/Form/EditForm/b6399519-9db6-4643-869a-0d329fdea85b/"

[erp.upload]
# ERP 附件业务常量，普通用户不应在设置页修改。
business_keyword = "NCC_HumProblem"
library_id = "98005811-fdd1-4449-a391-245543f32da5"
storage_type = "ftp"
chunk_size_bytes = 2097152

[erp.credentials]
# 环境变量名称，不是账号密码本身。
username_env = "EHRM_ERP_USERNAME"
password_env = "EHRM_ERP_PASSWORD"

[erp.selectors.login]
username = 'input[name="usercode"], #usercode'
password = 'input[name="userpass"], #userpass, input[type="password"]'
submit = 'button:has-text("登录"), button:has-text("登 录"), input[type="submit"]'

# -----------------------------------------------------------------------------
# AI / ERP 事务解析模块
# -----------------------------------------------------------------------------

[ai]
# 只在这里选择默认模型；每个模型的运行和采样参数位于 models 目录。
provider = "ollama"
active_model = "qwen3_5_9b"
models_dir = "models"

# Ollama 连接和业务提示词由所有模型共用。
base_url = "http://192.168.31.201:11434"
chat_path = "/api/chat"
prompt_path = "prompts/erp_task_extraction_v2_system.txt"
