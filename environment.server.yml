name: ehrm

channels:
  - conda-forge

# Web 服务器环境：Python 后端、自动化依赖和前端构建所需的 Node.js。
# 不安装 PySide6 桌面 GUI，也不安装测试或 Windows 打包依赖。
dependencies:
  - python=3.11.15
  - nodejs>=22.12,<23
  # 显式交给 Conda 安装，避免 pip 阶段中断后环境缺少 SQL Server 连接模块。
  - pyodbc=5.3.0
  - pip
  - pip:
      - -r requirements/backend.lock.txt
      - -e .
